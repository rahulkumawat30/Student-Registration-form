<!DOCTYPE html>
<html>

<head>
    <title>Student Registration Form</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header>
        <h1>Student Registration</h1>
    </header>
    <main>
        <section>
            <form>
                <label for="name">Name:</label>
                <input type="text" id="name" placeholder="Enter Your Name"><br><br>
                <label for="email">Email:</label>
                <input type="email" id="email" placeholder="Enter Your Email"><br><br>
                <label for="password">Password:</label>
                <input type="password" id="password" placeholder="Enter Your Password"><br><br>
                <label for="gender">Gender:</label><br>
                <input type="radio" name="gender">Male <br>
                <input type="radio" name="gender">Female
                <br><br>
                <label for="dob">Date Of Birth:</label><br>
                <input type="date" id="dob"><br><br>
                <label for="course">Course:</label><br><br>
                <select>
                    <option value="" selected disabled>Select Course</option>
                    <option>BCA</option>
                    <option>B.Tech</option>
                    <option>B.Com</option>
                </select><br><br>

                <label for="hobbies">Hobbies:</label><br>
                <input type="checkbox" id="coding"> <label for="coding"> Coding </label><br>
                <input type="checkbox" id="cricket"> <label for="cricket"> Cricket </label><br>
                <input type="checkbox" id="music"> <label for="music"> Music </label><br>
                <br>
                <label for="address">Address:</label><br><br>
                <textarea rows="4" cols="30" placeholder="Enter Your Address"></textarea>
                <br><br>
                <button type="submit">Register</button>
            </form>
        </section>
    </main>
    <footer>
        <p>&copy; 2026 Student Form</p>
    </footer>
</body>

</html>>
