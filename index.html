<!doctype html>
<html>

<head>
  <title>Student Registration Form</title>
  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <header>
    <h1>Student Registration Form</h1>
    <p>Fill the form to register yourself.</p>
  </header>
  <main>
    <section>
      <form id="registrationForm">
        <label for="name">Full Name:</label>
        <input name="name" type="text" id="name" placeholder="Enter Your Name" maxlength="15" /><br /><br />
        <label for="email">Email:</label>
        <input name="email" type="email" id="email" placeholder="Enter Your Email"  /><br /><br />
        <label for="password">Password:</label>
        <input name="password" type="password" id="password" placeholder="Enter Your Password"  /><br /><br />
        <label for="phone">Phone Number:</label>
        <input name="phone" id="phone" type="tel" placeholder="Enter Your Phone Number" maxlength="10"
          pattern="[0-9]{10}"  /><br /><br />
        <label for="dob">Date Of Birth:</label><br />
        <input name="dob" type="date" id="dob"  /><br /><br />
        <label for="gender">Gender:</label><br />
        <input type="radio" name="gender" value="male"  />Male <br />
        <input type="radio" name="gender" value="female"  />Female <br />
        <input type="radio" name="gender" value="other"> other <br><br>

        <label for="course">Course:</label><br />
        <select id="course" name="course" >
          <option value="" selected disabled>Select Course</option>
          <option>BCA</option>
          <option>B.Tech</option>
          <option>B.Com</option>
        </select><br /><br />

        <label for="hobbies">Hobbies:</label><br />
        <input name="coding" type="checkbox" id="coding" />
        <label for="coding"> Coding </label><br />
        <input name="cricket" type="checkbox" id="cricket" />
        <label for="cricket"> Cricket </label><br />
        <input name="music" type="checkbox" id="music" /> <label for="music"> Music </label><br />
        <br />
        <label for="address">Address:</label><br />
        <textarea id="address" name="address" rows="4" cols="30" placeholder="Enter Your Address" ></textarea>
        <br />
        <button type="submit">Register</button>
      </form>
    </section>
  </main>
  <footer>
    <p>&copy; 2026 Student Form</p>
  </footer>
  <script src="script.js"></script>
</body>

</html>
